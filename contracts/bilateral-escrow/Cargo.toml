[package]
name = "stated-bilateral-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.0", features = ["legacy"] }
# Keep transitive SDK host bindings compatible with the installed Rust 1.93.
near-sdk-env = "=0.1.5"
near-sys = "=0.2.13"
near-global-contracts = "=0.2.5"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
